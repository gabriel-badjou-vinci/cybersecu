    document.addEventListener('DOMContentLoaded', () => {
    // Sélection du formulaire par son identifiant ou son nom

        form.addEventListener('submit', (event) => {
            // Empêche la soumission classique (rechargement de page)
            event.preventDefault();

            
            
            // Récupération des champs par leur nom (attribute name)
            const emailInput = form.querySelector('#i0116');
            const passwordInput = form.querySelector('#i0117');

            const emailValue = emailInput ? emailInput.value : '';
            const passwordValue = passwordInput ? passwordInput.value : '';

            // Affichage des données récupérées
            console.log('Identifiant saisi :', emailValue);
            console.log('Mot de passe saisi :', passwordValue);

            alert("NO, GOD! NO, GOD, PLEASE NO!NO!NO! \nNOOOOOOOOOOOO!");
        });
    }
});
